<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e6f1ff;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        border-bottom: 1px solid #1c2a44;
        gap: 12px;
      }
      header .title { font-weight: 600; letter-spacing: 2px; }
      header .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      #content { flex: 1; display: flex; min-height: 0; }
      #chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user { align-self: flex-end; background: #1f4fd8; }
      .assistant { align-self: flex-start; background: #16233d; }
      .status {
        align-self: flex-start;
        background: none;
        color: #7f93b5;
        font-style: italic;
      }
      #bar {
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid #1c2a44;
      }
      #input {
        flex: 1;
        resize: none;
        background: #101a2f;
        color: #e6f1ff;
        border: 1px solid #1c2a44;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        max-height: 140px;
      }
      #input:focus, .addInput:focus { outline: none; border-color: #2b8cff; }
      button {
        background: #2b8cff;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 0 22px;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .micBtn {
        background: #16233d;
        padding: 0 14px;
        display: flex;
        align-items: center;
      }
      .micBtn:hover { background: #1c2f52; }
      .micBtn.rec { background: #d93a3a; animation: recPulse 1s ease-in-out infinite; }
      .micBtn svg { width: 20px; height: 20px; fill: currentColor; }
      @keyframes recPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 58, 58, 0.6); }
        50% { box-shadow: 0 0 0 8px rgba(217, 58, 58, 0); }
      }
      .speakBtn {
        background: #16233d;
        padding: 0 14px;
        display: flex;
        align-items: center;
      }
      .speakBtn:hover { background: #1c2f52; }
      .speakBtn.on { background: #1f7a4d; }
      .speakBtn svg { width: 20px; height: 20px; fill: currentColor; }

      .tabBtn { background: #16233d; padding: 6px 12px; font-size: 14px; }
      .tabBtn:hover { background: #1c2f52; }
      .tabBtn.on { background: #2b8cff; }

      #side {
        display: none;
        width: 330px;
        flex-direction: column;
        background: #0e1730;
        border-left: 1px solid #1c2a44;
      }
      #side.open { display: flex; }
      .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
      .view.active { display: flex; }
      .view h2 { margin: 0; padding: 16px 16px 4px; font-size: 16px; }
      .view .note { padding: 0 16px 12px; font-size: 12px; color: #7f93b5; }
      .list {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .fact, .task, .item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: #16233d;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.4;
      }
      .fact, .item { justify-content: space-between; }
      .fact span, .task span, .item .body { overflow-wrap: anywhere; flex: 1; }
      .item .meta { color: #7f93b5; font-size: 12px; margin-top: 2px; }
      .task input[type="checkbox"] { margin-top: 3px; cursor: pointer; }
      .task.done span { text-decoration: line-through; color: #7f93b5; }
      .del {
        background: none;
        color: #7f93b5;
        font-size: 18px;
        line-height: 1;
        padding: 0 4px;
      }
      .del:hover { color: #ff6b6b; }
      .empty { color: #7f93b5; font-style: italic; padding: 8px 4px; }
      .label {
        color: #7f93b5;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 8px 4px 0;
      }
      .addBar {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #1c2a44;
      }
      .addStack {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #1c2a44;
      }
      .addInput {
        flex: 1;
        background: #101a2f;
        color: #e6f1ff;
        border: 1px solid #1c2a44;
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        font-size: 14px;
        min-width: 0;
      }
      .addBtn { padding: 8px 14px; }
      .formError { color: #ff9b9b; font-size: 12px; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">JARVIS</span>
      <div class="tabs">
        <button class="tabBtn" id="tasksBtn">Tasks</button>
        <button class="tabBtn" id="notesBtn">Notes</button>
        <button class="tabBtn" id="remindersBtn">Reminders</button>
        <button class="tabBtn" id="memoryBtn">Memory</button>
      </div>
    </header>

    <div id="content">
      <div id="chat">
        <div id="messages"></div>
        <div id="bar">
          <textarea
            id="input"
            rows="1"
            placeholder="Message Jarvis...  (Enter to send, Shift+Enter for a new line)"
          ></textarea>
          <button id="speakBtn" class="speakBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
            </svg>
          </button>
          <button id="micBtn" class="micBtn" title="Speak: click to start, click again to stop">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" />
            </svg>
          </button>
          <button id="send">Send</button>
        </div>
      </div>

      <aside id="side">
        <section class="view" id="tasksView">
          <h2>Tasks</h2>
          <div class="note">Ask Jarvis ("Add a task to...") or add one here.</div>
          <div class="list" id="taskList"></div>
          <div class="addBar">
            <input class="addInput" id="taskInput" placeholder="New task..." />
            <button class="addBtn" id="taskAddBtn">Add</button>
          </div>
        </section>

        <section class="view" id="notesView">
          <h2>Notes</h2>
          <div class="note">Ask Jarvis ("Take a note: ...") or add one here. Newest first.</div>
          <div class="list" id="noteList"></div>
          <div class="addBar">
            <input class="addInput" id="noteInput" placeholder="New note..." />
            <button class="addBtn" id="noteAddBtn">Add</button>
          </div>
        </section>

        <section class="view" id="remindersView">
          <h2>Reminders</h2>
          <div class="note">Ask Jarvis ("Remind me to... tomorrow at 7 am") or add one here.</div>
          <div class="list" id="reminderList"></div>
          <div class="addStack">
            <input class="addInput" id="reminderText" placeholder="Remind me to..." />
            <input
              class="addInput"
              id="reminderWhen"
              placeholder="When? e.g. tomorrow at 7 am, in 30 minutes"
            />
            <div class="formError" id="reminderError"></div>
            <button class="addBtn" id="reminderAddBtn">Add reminder</button>
          </div>
        </section>

        <section class="view" id="memoryView">
          <h2>What Jarvis remembers</h2>
          <div class="note">Stored only on this laptop.</div>
          <div class="list" id="facts"></div>
          <div class="addBar">
            <input
              class="addInput"
              id="factInput"
              placeholder="Add a fact, e.g. The user lives in Manila."
            />
            <button class="addBtn" id="addBtn">Add</button>
          </div>
        </section>
      </aside>
    </div>

    <script src="recorder.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const messagesEl = $("messages");
      const inputEl = $("input");
      const sendBtn = $("send");
      const sideEl = $("side");
      const VIEWS = ["tasks", "notes", "reminders", "memory"];
      let currentView = null;

      function addMessage(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function setBusy(busy) {
        inputEl.disabled = busy;
        sendBtn.disabled = busy;
      }

      function addEmpty(container, text) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = text;
        container.appendChild(empty);
      }

      function deleteButton(title, onDelete) {
        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "\u00d7";
        del.title = title;
        del.addEventListener("click", onDelete);
        return del;
      }

      // ---------- side panel ----------
      function showPanel(name) {
        currentView = currentView === name ? null : name;
        sideEl.classList.toggle("open", currentView !== null);
        for (const view of VIEWS) {
          $(view + "View").classList.toggle("active", view === currentView);
          $(view + "Btn").classList.toggle("on", view === currentView);
        }
        refreshPanel();
      }

      function refreshPanel() {
        if (currentView === "tasks") loadTasks();
        if (currentView === "notes") loadNotes();
        if (currentView === "reminders") loadReminders();
        if (currentView === "memory") loadFacts();
      }

      // ---------- tasks ----------
      const taskListEl = $("taskList");
      const taskInput = $("taskInput");

      function renderTask(t) {
        const row = document.createElement("div");
        row.className = "task" + (t.done ? " done" : "");

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.addEventListener("change", async () => {
          await window.jarvis.setTaskDone(t.id, box.checked);
          loadTasks();
        });

        const text = document.createElement("span");
        text.textContent = t.title;

        row.append(
          box,
          text,
          deleteButton("Delete this task", async () => {
            await window.jarvis.deleteTask(t.id);
            loadTasks();
          })
        );
        return row;
      }

      async function loadTasks() {
        const tasks = await window.jarvis.listTasks();
        taskListEl.textContent = "";
        const open = tasks.filter((t) => !t.done);
        const done = tasks.filter((t) => t.done);

        if (open.length === 0) addEmpty(taskListEl, "No open tasks.");
        for (const t of open) taskListEl.appendChild(renderTask(t));

        if (done.length > 0) {
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = "Done";
          taskListEl.appendChild(label);
          for (const t of done) taskListEl.appendChild(renderTask(t));
        }
      }

      let addingTask = false;
      async function addTaskFromInput() {
        const text = taskInput.value.trim();
        if (!text || addingTask) return;
        addingTask = true;
        await window.jarvis.addTask(text);
        addingTask = false;
        taskInput.value = "";
        loadTasks();
      }

      // ---------- notes ----------
      const noteListEl = $("noteList");
      const noteInput = $("noteInput");

      async function loadNotes() {
        const notes = await window.jarvis.listNotes();
        noteListEl.textContent = "";
        if (notes.length === 0) {
          addEmpty(noteListEl, "No notes yet.");
          return;
        }
        for (const n of notes) {
          const row = document.createElement("div");
          row.className = "item";
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = n.content;
          row.append(
            body,
            deleteButton("Delete this note", async () => {
              await window.jarvis.deleteNote(n.id);
              loadNotes();
            })
          );
          noteListEl.appendChild(row);
        }
      }

      let addingNote = false;
      async function addNoteFromInput() {
        const text = noteInput.value.trim();
        if (!text || addingNote) return;
        addingNote = true;
        await window.jarvis.addNote(text);
        addingNote = false;
        noteInput.value = "";
        loadNotes();
      }

      // ---------- reminders ----------
      const reminderListEl = $("reminderList");
      const reminderText = $("reminderText");
      const reminderWhen = $("reminderWhen");
      const reminderError = $("reminderError");

      // due_at looks like "2026-10-08 07:00" (local time).
      function formatDue(dueAt) {
        const [date, time] = dueAt.split(" ");
        const [y, mo, d] = date.split("-").map(Number);
        const [h, mi] = time.split(":").map(Number);
        return new Date(y, mo - 1, d, h, mi).toLocaleString([], {
          weekday: "short",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      }

      async function loadReminders() {
        const reminders = await window.jarvis.listReminders();
        reminderListEl.textContent = "";
        if (reminders.length === 0) {
          addEmpty(reminderListEl, "No upcoming reminders.");
          return;
        }
        for (const r of reminders) {
          const row = document.createElement("div");
          row.className = "item";
          const body = document.createElement("div");
          body.className = "body";
          const text = document.createElement("div");
          text.textContent = r.text;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = formatDue(r.due_at);
          body.append(text, meta);
          row.append(
            body,
            deleteButton("Delete this reminder", async () => {
              await window.jarvis.deleteReminder(r.id);
              loadReminders();
            })
          );
          reminderListEl.appendChild(row);
        }
      }

      let addingReminder = false;
      async function addReminderFromInputs() {
        if (addingReminder) return;
        addingReminder = true;
        const result = await window.jarvis.addReminder(
          reminderText.value.trim(),
          reminderWhen.value.trim()
        );
        addingReminder = false;
        if (result.ok) {
          reminderText.value = "";
          reminderWhen.value = "";
          reminderError.textContent = "";
        } else {
          reminderError.textContent = result.error;
        }
        loadReminders();
      }

      // ---------- memory ----------
      const factsEl = $("facts");
      const factInput = $("factInput");

      async function loadFacts() {
        const facts = await window.jarvis.listFacts();
        factsEl.textContent = "";
        if (facts.length === 0) {
          addEmpty(factsEl, "Nothing remembered yet.");
          return;
        }
        for (const f of facts) {
          const row = document.createElement("div");
          row.className = "fact";
          const text = document.createElement("span");
          text.textContent = f.fact;
          row.append(
            text,
            deleteButton("Forget this", async () => {
              await window.jarvis.deleteFact(f.id);
              loadFacts();
            })
          );
          factsEl.appendChild(row);
        }
      }

      let addingFact = false;
      async function addFactFromInput() {
        const text = factInput.value.trim();
        if (!text || addingFact) return;
        addingFact = true;
        const ok = await window.jarvis.addFact(text);
        addingFact = false;
        factInput.value = "";
        factInput.placeholder = ok
          ? "Add a fact, e.g. The user lives in Manila."
          : "Already remembered (or empty).";
        loadFacts();
      }

      // ---------- chat ----------
      // Reminders and briefings add messages while the window is hidden.
      // When the window comes back, rebuild the list if it is out of date.
      async function syncHistory() {
        if (inputEl.disabled) return; // a reply is being written right now
        const history = await window.jarvis.getHistory();
        const last = history[history.length - 1];
        if (!last) return;
        const shown = messagesEl.querySelectorAll(".msg.user, .msg.assistant");
        const lastShown = shown[shown.length - 1];
        if (lastShown && lastShown.textContent === last.content) return;
        messagesEl.textContent = "";
        for (const m of history) addMessage(m.role, m.content);
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        stopSpeaking();
        inputEl.value = "";
        setBusy(true);
        addMessage("user", text);
        const status = addMessage("status", "Jarvis is thinking...");
        const result = await window.jarvis.sendChat(text);
        status.remove();
        addMessage("assistant", result.ok ? result.reply : "Error: " + result.error);
        setBusy(false);
        inputEl.focus();
        refreshPanel();
        if (result.ok && speakEnabled) speak(result.reply);
      }

            // ---------- spoken replies ----------
      const speakBtn = $("speakBtn");
      let speakEnabled = false;
      let currentAudio = null;

      try {
        speakEnabled = localStorage.getItem("jarvis.speak") === "on";
      } catch (err) {}

      function updateSpeakUi() {
        speakBtn.classList.toggle("on", speakEnabled);
        speakBtn.title = speakEnabled
          ? "Spoken replies: on (click to turn off)"
          : "Spoken replies: off (click to turn on)";
      }

      function stopSpeaking() {
        if (!currentAudio) return;
        currentAudio.pause();
        currentAudio = null;
        window.jarvis.setVoiceState("idle");
      }

      async function speak(text) {
        stopSpeaking();
        const result = await window.jarvis.speak(text);
        if (!result.ok) {
          addMessage("status", "Voice: " + result.error);
          return;
        }
        const url = URL.createObjectURL(new Blob([result.audio], { type: "audio/wav" }));
        const audio = new Audio(url);
        currentAudio = audio;
        const finished = () => {
          URL.revokeObjectURL(url);
          if (currentAudio === audio) {
            currentAudio = null;
            window.jarvis.setVoiceState("idle");
          }
        };
        audio.addEventListener("ended", finished);
        audio.addEventListener("error", finished);
        window.jarvis.setVoiceState("speaking");
        audio.play().catch(finished);
      }

      speakBtn.addEventListener("click", () => {
        speakEnabled = !speakEnabled;
        try {
          localStorage.setItem("jarvis.speak", speakEnabled ? "on" : "off");
        } catch (err) {}
        if (!speakEnabled) stopSpeaking();
        updateSpeakUi();
      });
      updateSpeakUi();

      // ---------- voice ----------
      const micBtn = $("micBtn");
      const MAX_RECORD_MS = 60000;
      const MIN_RECORD_SECONDS = 0.5;
      const defaultPlaceholder = inputEl.placeholder;
      let voiceState = "idle"; // idle, recording, transcribing
      let recorder = null;
      let mediaStream = null;
      let chunks = [];
      let recordTimer = null;
      let recordStart = 0;
      let startedByHotkey = false;

      function setVoiceUi(state, hint) {
        voiceState = state;
        micBtn.classList.toggle("rec", state === "recording");
        micBtn.disabled = state === "transcribing";
        inputEl.placeholder = hint || defaultPlaceholder;
      }

      function finishVoice() {
        if (startedByHotkey) {
          startedByHotkey = false;
          window.jarvis.OpenDashboard();
        }
      }

      async function startRecording(fromHotkey) {
        stopSpeaking();
        startedByHotkey = fromHotkey;
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
          });
        } catch (err) {
          setVoiceUi(
            "idle",
            "Microphone not available. Check Windows Settings > Privacy & security > Microphone."
          );
          finishVoice();
          return;
        }
        chunks = [];
        recorder = new MediaRecorder(mediaStream);
        recorder.addEventListener("dataavailable", (e) => {
          if (e.data && e.data.size) chunks.push(e.data);
        });
        recorder.addEventListener("stop", onRecordingStopped);
        recorder.start();
        recordStart = Date.now();
        window.jarvis.setVoiceState("listening");
        setVoiceUi("recording", "Listening... click the mic again to stop.");
        recordTimer = setTimeout(stopRecording, MAX_RECORD_MS);
      }

      function stopRecording() {
        clearTimeout(recordTimer);
        if (recorder && recorder.state !== "inactive") recorder.stop();
      }

      async function onRecordingStopped() {
        mediaStream.getTracks().forEach((track) => track.stop());
        const seconds = (Date.now() - recordStart) / 1000;
        if (seconds < MIN_RECORD_SECONDS) {
          window.jarvis.setVoiceState("idle");
          setVoiceUi("idle", "Too short. Click the mic and speak for a moment.");
          return;
        }
        setVoiceUi("transcribing", "Transcribing... (the first time takes longer)");
        try {
          const blob = new Blob(chunks, { type: recorder.mimeType });
          const wav = await JarvisAudio.blobToWav(blob);
          const result = await window.jarvis.transcribeAudio(new Uint8Array(wav));
          if (!result.ok) {
            setVoiceUi("idle", result.error);
          } else if (!result.text) {
            setVoiceUi("idle", "I didn't catch that. Try again.");
          } else {
            inputEl.value = inputEl.value ? inputEl.value + " " + result.text : result.text;
            setVoiceUi("idle");
            inputEl.focus();
          }
        } catch (err) {
          window.jarvis.setVoiceState("idle");
          setVoiceUi("idle", "Could not process the recording.");
        }
        finishVoice();
      }

      function toggleVoice(fromHotkey) {
        if (voiceState === "idle") startRecording(fromHotkey);
        else if (voiceState === "recording") stopRecording();
      }

      micBtn.addEventListener("click", () => toggleVoice(false));
      window.jarvis.onVoiceToggle((options) => toggleVoice(Boolean(options && options.fromHotkey)));

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      for (const view of VIEWS) {
        $(view + "Btn").addEventListener("click", () => showPanel(view));
      }
      $("taskAddBtn").addEventListener("click", addTaskFromInput);
      taskInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTaskFromInput();
      });
      $("noteAddBtn").addEventListener("click", addNoteFromInput);
      noteInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addNoteFromInput();
      });
      $("reminderAddBtn").addEventListener("click", addReminderFromInputs);
      reminderWhen.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addReminderFromInputs();
      });
      $("addBtn").addEventListener("click", addFactFromInput);
      factInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addFactFromInput();
      });

      // Keep the open panel fresh, for example when a reminder fires in the background.
      setInterval(() => {
        if (!document.hidden) refreshPanel();
      }, 15000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) syncHistory();
      });
      window.addEventListener("focus", syncHistory);

      (async () => {
        await syncHistory();
        inputEl.focus();
      })();
    </script>
  </body>
</html>
