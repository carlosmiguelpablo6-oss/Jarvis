<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ============ RESET ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    /* ============ BASE ============ */
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #0a0a0b;
      color: #ededed;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============ HEADER ============ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(10, 10, 11, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
      display: grid;
      place-items: center;
      color: #0a0a0b;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
    }

    .brand-name {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6b6b6b;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }

    /* ============ MESSAGES ============ */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    #messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
      background-clip: padding-box;
    }

    /* message container */
    .msg {
      max-width: 720px;
      width: fit-content;
      animation: fadeIn 0.2s ease-out;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* user message — right aligned */
    .msg.user {
      align-self: flex-end;
      background: #ffffff;
      color: #0a0a0b;
      padding: 12px 18px;
      border-radius: 20px;
      border-bottom-right-radius: 6px;
      font-weight: 400;
    }

    /* assistant message — plain text, no bubble */
    .msg.assistant {
      align-self: flex-start;
      color: #d4d4d4;
      padding: 4px 0;
      display: flex;
      gap: 14px;
    }

    .msg.assistant .avatar {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2a2a2d 0%, #1a1a1c 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #a0a0a0;
      margin-top: 2px;
    }

    .msg.assistant .content {
      padding-top: 2px;
    }

    /* status (thinking) */
    .msg.status {
      align-self: flex-start;
      color: #6b6b6b;
      font-size: 14px;
      padding: 4px 0;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .msg.status .avatar {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2a2a2d 0%, #1a1a1c 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #a0a0a0;
    }

    .typing {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .typing span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #6b6b6b;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }
    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* ============ INPUT BAR ============ */
    .input-wrapper {
      padding: 16px 24px 24px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(10, 10, 11, 0.9) 30%
      );
    }

    #bar {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 8px 8px 8px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #bar:focus-within {
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03),
        0 8px 40px rgba(0, 0, 0, 0.5);
    }

    #input {
      flex: 1;
      resize: none;
      background: transparent;
      color: #ededed;
      border: none;
      padding: 10px 0;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 160px;
      min-height: 24px;
      outline: none;
    }

    #input::placeholder {
      color: #555;
      font-weight: 400;
    }

    #input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #0a0a0b;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.2s, opacity 0.2s;
      padding: 0;
    }

    #send svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.15s;
    }

    #send:hover:not(:disabled) {
      background: #e5e5e5;
      transform: scale(1.05);
    }

    #send:active:not(:disabled) {
      transform: scale(0.95);
    }

    #send:disabled {
      background: #2a2a2d;
      color: #555;
      cursor: not-allowed;
      opacity: 1;
    }

    #send:disabled svg {
      transform: none;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 640px) {
      header {
        padding: 14px 18px;
      }

      .brand-status span:last-child {
        display: none;
      }

      #messages {
        padding: 20px 16px 8px;
        gap: 16px;
      }

      .msg {
        max-width: 88%;
        font-size: 14.5px;
      }

      .input-wrapper {
        padding: 12px 16px 16px;
      }

      #bar {
        padding: 6px 6px 6px 16px;
      }

      #input {
        font-size: 14.5px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">J</div>
      <div class="brand-name">Jarvis</div>
    </div>
    <div class="brand-status">
      <div class="status-dot"></div>
      <span>Online</span>
    </div>
  </header>

  <div id="messages"></div>

  <div class="input-wrapper">
    <div id="bar">
      <textarea
        id="input"
        rows="1"
        placeholder="Message Jarvis…"
      ></textarea>
      <button id="send" aria-label="Send message">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    /* ----- message rendering ----- */
    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;

      if (role === "user") {
        el.textContent = text;
      } else if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "J";

        const content = document.createElement("div");
        content.className = "content";
        content.textContent = text;

        el.appendChild(avatar);
        el.appendChild(content);
      } else if (role === "status") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "J";

        const content = document.createElement("div");
        content.className = "content";
        content.innerHTML =
          '<span class="typing"><span></span><span></span><span></span></span>';

        el.appendChild(avatar);
        el.appendChild(content);
      } else {
        el.textContent = text;
      }

      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    /* ----- busy state ----- */
    function setBusy(busy) {
      inputEl.disabled = busy;
      sendBtn.disabled = busy;
    }

    /* ----- auto-resize textarea ----- */
    function autoResize() {
      inputEl.style.height = "auto";
      const newHeight = Math.min(inputEl.scrollHeight, 160);
      inputEl.style.height = newHeight + "px";
    }

    inputEl.addEventListener("input", autoResize);

    /* ----- send handler ----- */
    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      inputEl.style.height = "auto";
      setBusy(true);

      addMessage("user", text);
      const status = addMessage("status", "");

      try {
        const result = await window.jarvis.sendChat(text);
        status.remove();
        addMessage(
          "assistant",
          result.ok ? result.reply : "Error: " + result.error
        );
      } catch (err) {
        status.remove();
        addMessage("assistant", "Error: " + err.message);
      }

      setBusy(false);
      inputEl.focus();
      autoResize();
    }

    /* ----- events ----- */
    sendBtn.addEventListener("click", send);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    /* ----- initial history load ----- */
    (async () => {
      try {
        const history = await window.jarvis.getHistory();
        for (const m of history) addMessage(m.role, m.content);
      } catch (e) {
        /* bridge not ready — ignore */
      }
      inputEl.focus();
      autoResize();
    })();
  </script>
</body>
</html>
