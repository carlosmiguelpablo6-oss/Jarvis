<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e6f1ff;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        border-bottom: 1px solid #1c2a44;
      }
      header .title { font-weight: 600; letter-spacing: 2px; }
      #content { flex: 1; display: flex; min-height: 0; }
      #chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user { align-self: flex-end; background: #1f4fd8; }
      .assistant { align-self: flex-start; background: #16233d; }
      .status {
        align-self: flex-start;
        background: none;
        color: #7f93b5;
        font-style: italic;
      }
      #bar {
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid #1c2a44;
      }
      #input {
        flex: 1;
        resize: none;
        background: #101a2f;
        color: #e6f1ff;
        border: 1px solid #1c2a44;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        max-height: 140px;
      }
      #input:focus, #factInput:focus { outline: none; border-color: #2b8cff; }
      button {
        background: #2b8cff;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 0 22px;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #memoryBtn { background: #16233d; padding: 6px 14px; font-size: 14px; }
      #memoryBtn:hover { background: #1c2f52; }

      #memory {
        display: none;
        width: 320px;
        flex-direction: column;
        background: #0e1730;
        border-left: 1px solid #1c2a44;
      }
      #memory.open { display: flex; }
      #memory h2 { margin: 0; padding: 16px 16px 4px; font-size: 16px; }
      #memory .note { padding: 0 16px 12px; font-size: 12px; color: #7f93b5; }
      #facts {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .fact {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        background: #16233d;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.4;
      }
      .fact span { overflow-wrap: anywhere; }
      .del {
        background: none;
        color: #7f93b5;
        font-size: 18px;
        line-height: 1;
        padding: 0 4px;
      }
      .del:hover { color: #ff6b6b; }
      .empty { color: #7f93b5; font-style: italic; padding: 8px 4px; }
      #addBar {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #1c2a44;
      }
      #factInput {
        flex: 1;
        background: #101a2f;
        color: #e6f1ff;
        border: 1px solid #1c2a44;
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        font-size: 14px;
        min-width: 0;
      }
      #addBtn { padding: 0 14px; }
    </style>
  </head>
  <body>
    <header>
      <span class="title">JARVIS</span>
      <button id="memoryBtn">Memory</button>
    </header>

    <div id="content">
      <div id="chat">
        <div id="messages"></div>
        <div id="bar">
          <textarea
            id="input"
            rows="1"
            placeholder="Message Jarvis...  (Enter to send, Shift+Enter for a new line)"
          ></textarea>
          <button id="send">Send</button>
        </div>
      </div>

      <aside id="memory">
        <h2>What Jarvis remembers</h2>
        <div class="note">Stored only on this laptop.</div>
        <div id="facts"></div>
        <div id="addBar">
          <input id="factInput" placeholder="Add a fact, e.g. The user lives in Manila." />
          <button id="addBtn">Add</button>
        </div>
      </aside>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const memoryEl = document.getElementById("memory");
      const factsEl = document.getElementById("facts");
      const factInput = document.getElementById("factInput");

      function addMessage(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function setBusy(busy) {
        inputEl.disabled = busy;
        sendBtn.disabled = busy;
      }

      async function loadFacts() {
        const facts = await window.jarvis.listFacts();
        factsEl.textContent = "";
        if (facts.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Nothing remembered yet.";
          factsEl.appendChild(empty);
          return;
        }
        for (const f of facts) {
          const row = document.createElement("div");
          row.className = "fact";
          const text = document.createElement("span");
          text.textContent = f.fact;
          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "\u00d7";
          del.title = "Forget this";
          del.addEventListener("click", async () => {
            await window.jarvis.deleteFact(f.id);
            loadFacts();
          });
          row.append(text, del);
          factsEl.appendChild(row);
        }
      }

      let adding = false;

      async function addFactFromInput() {
        const text = factInput.value.trim();
        if (!text || adding) return;
        adding = true;
        const ok = await window.jarvis.addFact(text);
        adding = false;
        factInput.value = "";
        factInput.placeholder = ok
          ? "Add a fact, e.g. The user lives in Manila."
          : "Already remembered (or empty).";
        loadFacts();
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        setBusy(true);
        addMessage("user", text);
        const status = addMessage("status", "Jarvis is thinking...");
        const result = await window.jarvis.sendChat(text);
        status.remove();
        addMessage("assistant", result.ok ? result.reply : "Error: " + result.error);
        setBusy(false);
        inputEl.focus();
        if (memoryEl.classList.contains("open")) loadFacts();
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      document.getElementById("memoryBtn").addEventListener("click", () => {
        memoryEl.classList.toggle("open");
        if (memoryEl.classList.contains("open")) loadFacts();
      });
      document.getElementById("addBtn").addEventListener("click", addFactFromInput);
      factInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addFactFromInput();
      });

      (async () => {
        const history = await window.jarvis.getHistory();
        for (const m of history) addMessage(m.role, m.content);
        inputEl.focus();
      })();
    </script>
  </body>
</html>
